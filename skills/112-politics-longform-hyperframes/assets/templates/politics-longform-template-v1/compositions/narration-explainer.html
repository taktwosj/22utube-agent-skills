      <div id="narration-explainer-source-date" data-hf-id="narration-explainer-source-date" data-role="source-date" data-hf-role="source-date" class="clip metadata source-date" data-start="0" data-duration="8" data-track-index="16" style="position:absolute">2026.07.25</div>
      <div id="narration-explainer-comment-label" data-hf-id="narration-explainer-comment-label" data-role="comment-label" data-hf-role="comment-label" class="clip metadata comment-label" data-start="0" data-duration="8" data-track-index="17" style="position:absolute">댓글로 의견 부탁드려요!</div>

      <div id="narration-explainer-caption-band" data-hf-id="narration-explainer-caption-band" data-role="lower-caption-band" data-hf-role="lower-caption-band" class="clip lower-caption-band" data-start="0" data-duration="8" data-track-index="19" style="position:absolute"></div>

결과로 평가받습니다</div>
    </main>
    <script src="src/template.js" data-tokens="style_tokens.json"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["narration-explainer"] = {
        duration: () => 8,
        seek: () => window.__timelines["narration-explainer"],
        pause: () => window.__timelines["narration-explainer"]
