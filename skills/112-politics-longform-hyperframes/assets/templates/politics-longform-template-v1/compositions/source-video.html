<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>원본 영상</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main id="root" data-hf-id="source-video-root" data-composition-id="source-video" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="source-video-top-frame" data-hf-id="source-video-top-frame" data-role="top-frame" data-hf-role="top-frame" class="clip top-frame" data-start="0" data-duration="8" data-track-index="10" style="position:absolute"></div>
      <div id="source-video-bottom-frame" data-hf-id="source-video-bottom-frame" data-role="bottom-frame" data-hf-role="bottom-frame" class="clip bottom-frame" data-start="0" data-duration="8" data-track-index="11" style="position:absolute"></div>
      <div id="source-video-focus-lines" data-hf-id="source-video-focus-lines" data-role="focus-lines" data-hf-role="focus-lines" class="clip focus-lines" data-start="0" data-duration="8" data-track-index="12" style="position:absolute"></div>
      <div id="source-video-chapter-number" data-hf-id="source-video-chapter-number" data-role="chapter-number" data-hf-role="chapter-number" class="clip metadata chapter-number" data-start="0" data-duration="8" data-track-index="13" style="position:absolute">챕터 2</div>
      <div id="source-video-chapter-title" data-hf-id="source-video-chapter-title" data-role="chapter-title" data-hf-role="chapter-title" class="clip metadata chapter-title" data-start="0" data-duration="8" data-track-index="14" style="position:absolute">확인된 원본 발언</div>
      <div id="source-video-source-label" data-hf-id="source-video-source-label" data-role="source-label" data-hf-role="source-label" class="clip metadata source-label" data-start="0" data-duration="8" data-track-index="15" style="position:absolute">출처 방송 원본</div>
      <div id="source-video-source-date" data-hf-id="source-video-source-date" data-role="source-date" data-hf-role="source-date" class="clip metadata source-date" data-start="0" data-duration="8" data-track-index="16" style="position:absolute">2026.07.25</div>
      <div id="source-video-comment-label" data-hf-id="source-video-comment-label" data-role="comment-label" data-hf-role="comment-label" class="clip metadata comment-label" data-start="0" data-duration="8" data-track-index="17" style="position:absolute">댓글로 의견 부탁드려요!</div>
      <div id="source-video-subscribe-label" data-hf-id="source-video-subscribe-label" data-role="subscribe-label" data-hf-role="subscribe-label" class="clip metadata subscribe-label" data-start="0" data-duration="8" data-track-index="18" style="position:absolute">구독은 큰 힘이 됩니다.</div>
      <div id="source-video-caption-band" data-hf-id="source-video-caption-band" data-role="lower-caption-band" data-hf-role="lower-caption-band" class="clip lower-caption-band" data-start="0" data-duration="8" data-track-index="19" style="position:absolute"></div>
      <div id="source-video-caption-text" data-hf-id="source-video-caption-text" data-role="caption-text" data-hf-role="caption-text" class="clip caption-text" data-start="0" data-duration="8" data-track-index="20" style="position:absolute">정치는 말보다
결과로 평가받습니다</div>
    </main>
    <script src="src/template.js" data-tokens="style_tokens.json"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["source-video"] = {
        duration: () => 8,
        seek: () => window.__timelines["source-video"],
        pause: () => window.__timelines["source-video"]
      };
    </script>
  </body>
</html>
