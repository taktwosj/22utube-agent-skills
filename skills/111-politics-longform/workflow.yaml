    requires: [G10]
    manual_events:
      - RETURN_NARRATION
      - RETURN_EXTERNAL_REVIEW_R1
      - RETURN_EXTERNAL_REVIEW_R2
    wait_states:
      - WAIT_EXTERNAL_RETURN
      - WAIT_USER_EDITORIAL_CONFIRMATION
      - PENDING_EVIDENCE
  G30:
    name: SOURCE_OR_NARRATION_AUDIO_MEASUREMENT
    instruction: references/gates/G30_AUDIO.md
