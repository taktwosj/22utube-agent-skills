      reason_code: NO_GENERATED_TTS
    manual_events: []
  G40:
    name: FINAL_CAPTION_AND_SRT_LOCK
    instruction: references/gates/G40_CAPTION_SRT.md
    validator: scripts/validate_stage_gate.py
    requires: [G30]
    user_corrected_srt_is_authority: true
    manual_events: []
  G50:
    name: POLITICS_TRACK_PLAN
    instruction: references/gates/G50_TRACK_PLAN.md
    validator: scripts/validate_stage_gate.py
    requires: [G40]
    manual_events: []
  G60:
    name: CLEAN_POLITICS_ASSEMBLY_AND_STATIC_HARNESS
    instruction: references/gates/G60_CLEAN_ASSEMBLY.md
    validator: scripts/validate_stage_gate.py
    requires: [G50]
    static_pass_transitions_to: WAIT_USER_VISUAL_GATE
    manual_events: []
  G60.USER:
    name: USER_VISUAL_GATE
    instruction: references/gates/G60_CLEAN_ASSEMBLY.md
    validator: scripts/validate_stage_gate.py
    wait_state: WAIT_USER_VISUAL_GATE
    manual_events: [USER_VISUAL_PASS]
  G70:
    name: UPLOAD_PACKAGE_RELEASE_FALSE
    instruction: references/gates/G70_UPLOAD_PACKAGE.md
    validator: scripts/validate_stage_gate.py
    requires: [G60.USER]
    release_allowed: false
    actual_upload: WAIT_UPLOAD_APPROVAL
    manual_events: []
  G80:
    name: RENDER_AND_MEDIA_INTEGRITY
    instruction: references/gates/G80_RENDER.md
    validator: scripts/validate_stage_gate.py
    requires: [G70]
    manual_events: []
  G90:
    name: FINAL_QC_AND_RELEASE_GATE
    instruction: references/gates/G90_FINAL_QC.md
    validator: scripts/validate_stage_gate.py
    requires: [G80]
    release_requires: [FINAL_QC_PASS, UPLOAD_APPROVED]
    actual_upload: WAIT_UPLOAD_APPROVAL
    manual_events: [UPLOAD_APPROVED]

external_review_policy:
  transport: USER_MANUAL_ONLY
  browser_automation: FORBIDDEN
  api_calls: FORBIDDEN
  automatic_retry: FORBIDDEN
  external_result_authority: RECOMMENDATION_ONLY
  same_conversation_round2_required: true

