interface:
  display_name: "11short Production Agent"
  short_description: "11short CapCut remake with source-verified Gemini raw normalization"
  default_prompt: "Use $000short-production-agent to plan, review, hand off, receive Tikitaka tikitaka_production_input folders, normalize Gemini v2.1 raw JSON after source.mp4/watch/direct-frame verification, or explicitly generate requested voice for an 11short CapCut remake. A URL-only request is a full production request by default: continue through source download, Gemini raw extraction, watch/direct-frame verification of source_audio_mode, scene order, OCR, speech, timing, visual focus, normalized analysis.json, assets/SRT/layout, visible local CapCut draft/project creation, and harness stages unless the user explicitly says analysis-only/review-only. Before final captions, overlays, optional voice, or CapCut, require audio-off comprehension, a hooked/fun copy-ready final_script_ko from the writer pass, and real random 5-persona sub-agent review when available, with 3 of 5 required to pass; keep the normal 3-text harness layout. For cross-machine work, use OneDrive 11short_handoff packages with Tikitaka input manifests or handoff_manifest locks instead of copying live CapCut drafts, then register a visible local CapCut project before calling the draft ready."
